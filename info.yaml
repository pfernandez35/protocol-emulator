# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"
  author:       "Paul Fernandez"
  discord:      ""
  description:  "A tiny programmable core for bit-banging hardware protocols (UART/SPI/I2C) in firmware"
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street ASIC competition: the blog post instructs 6x4.
  # NOTE: the upstream template comment only lists up to 8x2 -- CI is the
  # authority on whether 6x4 is accepted yet. See context/02-decisions.md (ADR-002).
  tiles: "6x4"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_pfernandez35_protoemu"

  # Source files must be in ./src, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "uart_tx.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "TXDATA[0]"
  ui[1]: "TXDATA[1]"
  ui[2]: "TXDATA[2]"
  ui[3]: "TXDATA[3]"
  ui[4]: "TXDATA[4]"
  ui[5]: "TXDATA[5]"
  ui[6]: "TXDATA[6]"
  ui[7]: "TXDATA[7]"

  # Outputs
  uo[0]: "UART TX"
  uo[1]: "BUSY"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "LOAD strobe (in)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
